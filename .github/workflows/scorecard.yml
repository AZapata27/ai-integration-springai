# OpenSSF Scorecard: supply-chain security checks, published to scorecard.dev (README badge)
# and uploaded as SARIF to Code Scanning.
#
# publish_results: true only works when the workflow follows the restrictions of
# ossf/scorecard-action (https://github.com/ossf/scorecard-action#workflow-restrictions):
#   - no top-level env or defaults, no write permissions outside the analysis job;
#   - the job runs on a GitHub-hosted Ubuntu runner, without env/defaults/containers/services;
#   - steps only use allowlisted actions (no `run:` steps).
name: Scorecard supply-chain security

on:
  # Re-evaluates Branch-Protection when the branch protection rules change.
  branch_protection_rule:
  # Weekly run so the published score stays fresh.
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [master]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # read workflow runs (private repos / Code Scanning upload)
      security-events: write   # upload the SARIF to Code Scanning
      id-token: write          # OIDC token to publish results to scorecard.dev
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
